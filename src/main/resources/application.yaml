spring:
  application:
    name: mobile-banking
    port: ${SERVER_PORT:8080}

  datasource:
    url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mobile_banking}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:password}"
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true
        "[use_sql_comments]": true
        dialect: org.hibernate.dialect.MySQLDialect