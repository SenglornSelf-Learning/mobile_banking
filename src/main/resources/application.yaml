spring:
  application:
    name: mobile-banking
    port: ${SERVER_PORT:8080}

  # Database using property configuration
  datasource:
    url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mobile_banking}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:password}"

  # Spring data JPA configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true
        "[use_sql_comments]": true
        dialect: org.hibernate.dialect.MySQLDialect

  # Email configuration
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:thelab.sendonly@gmail.com}
    password: ${SMTP_PASSWORD:hspz szng mphr egfw}
    properties:
      mail:
        smtp:
          auth: true
          "[connectiontimeout]": 10000
          timeout: 10000
          writetimeout: 10000
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}
          ssl:
            enable: ${SMTP_SSL_ENABLE:false}

# security using secret-key configuration
ims:
  api:
    security:
      authentication-method: service-key
      service-key:
        header-name: "${IMS_API_SECRET_HEADER:X-IMS-Secret-Key}"
        secret-key: "${IMS_API_SECRET_KEY:bEaAuNXWtPy70aW1KbW2rEVnXtUTz8}"

# spring doc UI swagger configuration
springdoc:
  model-converters:
    pageable-converter:
      enabled: false
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
  show-actuator: false

# Globals path upload file configuration
Globals:
  fileStorePath: ${FILE_STORE_PATH:./upload}
  fileUpload:
    maxFileSize: ${FILE_UPLOAD_MAX_SIZE:10000000}
    blockedExtensions: exe,bat,cmd,com,msi,scr,ps1,vbs